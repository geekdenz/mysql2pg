[package]
name = "mysql2pg-middleware"
version = "0.0.2"
edition = "2021"
description = "A Rust middleware that parses MySQL SQL, translates it to PostgreSQL SQL, and can expose a MySQL-compatible server front end."
license = "MIT"

[package.metadata.deb]
maintainer = "Denz <geekdenz@users.noreply.github.com>"
copyright = "2026, Denz"
extended-description = "MySQL-compatible SQL translation middleware backed by PostgreSQL."
section = "database"
priority = "optional"
assets = [
    ["target/release/mysql2pg-middleware", "usr/bin/mysql2pg-middleware", "755"],
    ["config/example.toml", "etc/mysql2pg-middleware/example.toml", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mysql2pg-middleware", dest = "/usr/bin/mysql2pg-middleware", mode = "755" },
    { source = "config/example.toml", dest = "/etc/mysql2pg-middleware/example.toml", mode = "644", config = true },
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.8", features = ["json", "tokio", "http1"] }
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15.7"
opensrv-mysql = "0.7.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.61"
thiserror = "2"
tokio = { version = "1.50", features = ["full"] }
tokio-postgres = { version = "0.7.17", features = ["runtime", "with-serde_json-1"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1"

[patch.crates-io]
opensrv-mysql = { path = "vendor/opensrv-mysql" }
