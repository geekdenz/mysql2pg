services:
  middleware:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      # Optional: every variable below has a default, so a fresh clone and CI
      # work without a .env file. Local overrides are picked up when present.
      - path: .env
        required: false
    environment:
      MW_SERVER_BIND_ADDR: ${MW_SERVER_BIND_ADDR:-0.0.0.0:8080}
      MW_MYSQL_BIND_ADDR: ${MW_MYSQL_BIND_ADDR:-0.0.0.0:3306}
      MW_POSTGRES_DRIVER: ${MW_POSTGRES_DRIVER:-tokio-postgres}
      MW_POSTGRES_CONNECTION_STRING: ${MW_POSTGRES_CONNECTION_STRING:-host=postgres port=5432 user=postgres password=postgres dbname=app}
      MW_TRANSLATOR_REWRITE_LIMIT_COMMA: ${MW_TRANSLATOR_REWRITE_LIMIT_COMMA:-true}
      MW_TRANSLATOR_NORMALIZE_MYSQL_BACKTICKS: ${MW_TRANSLATOR_NORMALIZE_MYSQL_BACKTICKS:-true}
      MW_TRANSLATOR_NORMALIZE_BOOLEAN_LITERALS: ${MW_TRANSLATOR_NORMALIZE_BOOLEAN_LITERALS:-true}
      MW_TRANSLATOR_REWRITE_MYSQL_FUNCTIONS: ${MW_TRANSLATOR_REWRITE_MYSQL_FUNCTIONS:-true}
      MW_TRANSLATOR_REWRITE_JSON_OPERATORS: ${MW_TRANSLATOR_REWRITE_JSON_OPERATORS:-true}
      MW_TRANSLATOR_STRIP_MYSQL_TABLE_OPTIONS: ${MW_TRANSLATOR_STRIP_MYSQL_TABLE_OPTIONS:-true}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${MIDDLEWARE_PORT:-8080}:8080"
      - "${MYSQL_FRONTEND_PORT:-3306}:3306"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["mysql2pg-middleware", "--config", "/app/config/example.toml", "serve"]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  matomo:
    image: matomo:${MATOMO_IMAGE_TAG:-5.10.1-apache}
    profiles: ["matomo"]
    environment:
      PHP_MEMORY_LIMIT: ${MATOMO_PHP_MEMORY_LIMIT:-512M}
      MATOMO_ARCHIVE_URL: ${MATOMO_ARCHIVE_URL:-http://matomo}
    ports:
      - "${MATOMO_PORT:-8081}:80"
    depends_on:
      middleware:
        condition: service_started
    volumes:
      - matomo_data:/var/www/html

  matomo-archive:
    image: matomo:${MATOMO_IMAGE_TAG:-5.10.1-apache}
    profiles: ["matomo-archive"]
    environment:
      PHP_MEMORY_LIMIT: ${MATOMO_PHP_MEMORY_LIMIT:-512M}
      MATOMO_ARCHIVE_URL: ${MATOMO_ARCHIVE_URL:-http://matomo}
    depends_on:
      matomo:
        condition: service_started
    volumes:
      - matomo_data:/var/www/html
    command: ["sh", "-lc", "while true; do php /var/www/html/console core:archive --url=$${MATOMO_ARCHIVE_URL}; sleep 300; done"]

  # SilverStripe CMS, configured with its stock MariaDB/PDO driver, pointed at
  # the middleware. Nothing in the container knows PostgreSQL exists.
  silverstripe:
    build:
      context: examples/silverstripe
      dockerfile: Dockerfile
    profiles: ["silverstripe"]
    environment:
      SS_DATABASE_CLASS: ${SS_DATABASE_CLASS:-MySQLPDODatabase}
      SS_DATABASE_SERVER: ${SS_DATABASE_SERVER:-middleware}
      SS_DATABASE_PORT: ${SS_DATABASE_PORT:-3306}
      SS_DATABASE_NAME: ${SS_DATABASE_NAME:-silverstripe}
      SS_DATABASE_USERNAME: ${SS_DATABASE_USERNAME:-anyuser}
      SS_DATABASE_PASSWORD: ${SS_DATABASE_PASSWORD:-matomo}
      SS_ENVIRONMENT_TYPE: ${SS_ENVIRONMENT_TYPE:-dev}
      SS_DEFAULT_ADMIN_USERNAME: ${SS_DEFAULT_ADMIN_USERNAME:-admin}
      SS_DEFAULT_ADMIN_PASSWORD: ${SS_DEFAULT_ADMIN_PASSWORD:-password}
    ports:
      - "${SILVERSTRIPE_PORT:-8082}:80"
    depends_on:
      middleware:
        condition: service_started
    volumes:
      - silverstripe_assets:/var/www/html/public/assets

volumes:
  postgres_data:
  silverstripe_assets:
  matomo_data:
    name: ${MATOMO_DATA_VOLUME:-mysql2pg-middleware_matomo_manual_install_data}
